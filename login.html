
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VAPOR | Admin Login</title>
    <!-- Favicon -->

  <link rel="icon" type="image/png" href="images/logo-light.png">


    <!-- GOOGLE FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- FONT AWESOME -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- LOGIN CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- RESPONSIVE CSS -->
    <link rel="stylesheet" href="css/responsive.css">

</head>

<body>

    <!-- =========================================
         VAPOR LOGIN PAGE
    ========================================== -->

    <main class="vapor-login-section" id="vaporLogin">

        <!-- TOP CONTROLS -->
        <div class="vapor-login-controls">

            <!-- RTL BUTTON -->
                    <button class="vapor-header-icon"
                            type="button"
                            id="vaporRtlToggle"
                            aria-label="Toggle RTL"
                            title="Toggle RTL">

                        <i class="fa-solid fa-right-left"></i>

                    </button>


                    <!-- DARK MODE BUTTON -->
                    <button class="vapor-header-icon"
                            type="button"
                            id="vaporThemeToggle"
                            aria-label="Toggle dark mode"
                            title="Toggle Dark Mode">

                        <i class="fa-solid fa-moon"></i>

                    </button>

        </div>


        <!-- =====================================
             LOGIN CARD
        ====================================== -->

        <section class="vapor-login-card">

            <!-- LOGO -->
            <div class="vapor-login-logo">

                <a href="index.html">

                    <img src="images/logo-light.png"
                        alt="VAPOR Logo"
                        class="logo-dark">

                    <img src="images/logo.png"
                        alt="VAPOR Logo"
                        class="logo-light">

                </a>

            </div>


            <!-- WELCOME BADGE -->
            <div class="vapor-login-badge">
                Welcome Back
            </div>


            <!-- HEADER -->
            <div class="vapor-login-header">

                <h1>
                    Sign In to Your
                    <span>Account</span>
                </h1>

                <p>
                    Sign in to manage website content, review general
                    enquiries, and access informational resources.
                </p>

            </div>


            <!-- =================================
                 LOGIN FORM
            ================================== -->

            <form class="vapor-login-form"
                id="vaporLoginForm">

                <!-- EMAIL -->
                <div class="vapor-login-field">

                    <label for="vaporLoginEmail">
                        Email Address <span>*</span>
                    </label>

                    <input
                        type="email"
                        id="vaporLoginEmail"
                        name="email"
                        placeholder="Enter your email address"
                        autocomplete="username"
                        required>

                </div>


                <!-- PASSWORD -->
                <div class="vapor-login-field">

                    <label for="vaporLoginPassword">
                        Password <span>*</span>
                    </label>

                    <div class="vapor-login-password-wrap">

                        <input
                            type="password"
                            id="vaporLoginPassword"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required>

                        <button
                            type="button"
                            class="vapor-login-password-toggle"
                            id="vaporPasswordToggle"
                            aria-label="Show password">

                            <i class="fa-regular fa-eye"></i>

                        </button>

                    </div>

                </div>


                <!-- REMEMBER & FORGOT -->
                <div class="vapor-login-options">

                    <label class="vapor-login-remember">

                        <input type="checkbox" name="remember">

                        <span>Remember me</span>

                    </label>

                    <a href="forgot-password.html"
                        class="vapor-login-forgot">

                        Forgot Password?

                    </a>

                </div>


                <!-- SIGN IN BUTTON -->
                <button type="submit"
                    class="vapor-login-submit">

                    <span>Sign In</span>

                    <i class="fa-solid fa-arrow-right"></i>

                </button>

            </form>


            <!-- =================================
                 SOCIAL LOGIN DIVIDER
            ================================== -->

            <div class="vapor-login-divider">

                <span></span>

                <p>Or continue with</p>

                <span></span>

            </div>


            <!-- =================================
                 SOCIAL LOGIN BUTTONS
            ================================== -->

            <div class="vapor-login-social">

                <!-- GOOGLE -->
                <button type="button"
                    class="vapor-login-social-btn vapor-login-google"
                    aria-label="Continue with Google">

                    <svg viewBox="0 0 48 48"
                        xmlns="http://www.w3.org/2000/svg"
                        aria-hidden="true">

                        <path fill="#EA4335"
                            d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>

                        <path fill="#4285F4"
                            d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.24 5.48-4.7 7.18l7.22 5.6c4.22-3.9 7.52-9.65 7.52-17.25z"/>

                        <path fill="#FBBC05"
                            d="M10.53 28.59A14.5 14.5 0 0 1 9.75 24c0-1.59.27-3.13.75-4.59l-7.98-6.19A23.94 23.94 0 0 0 0 24c0 3.87.93 7.52 2.56 10.78l7.97-6.19z"/>

                        <path fill="#34A853"
                            d="M24 48c6.48 0 11.93-2.13 15.91-5.8l-7.22-5.6c-2 1.34-4.54 2.14-8.69 2.14-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>

                    </svg>

                    <span>Google</span>

                </button>


                <!-- FACEBOOK -->
                <button type="button"
                    class="vapor-login-social-btn vapor-login-facebook"
                    aria-label="Continue with Facebook">

                    <svg viewBox="0 0 24 24"
                        xmlns="http://www.w3.org/2000/svg"
                        aria-hidden="true">

                        <path fill="#1877F2"
                            d="M24 12a12 12 0 1 0-13.875 11.85v-8.38H7.078V12h3.047V9.356c0-3.007 1.792-4.67 4.533-4.67 1.313 0 2.686.235 2.686.235v2.953h-1.513c-1.49 0-1.956.925-1.956 1.874V12h3.328l-.532 3.47h-2.796v8.38A12.002 12.002 0 0 0 24 12z"/>

                    </svg>

                    <span>Facebook</span>

                </button>


                <!-- APPLE -->
                <button type="button"
                    class="vapor-login-social-btn vapor-login-apple"
                    aria-label="Continue with Apple">

                    <svg viewBox="0 0 24 24"
                        xmlns="http://www.w3.org/2000/svg"
                        aria-hidden="true">

                        <path fill="currentColor"
                            d="M16.7 12.8c0-2.2 1.8-3.3 1.9-3.4-1-1.5-2.6-1.7-3.2-1.7-1.4-.1-2.7.8-3.4.8-.7 0-1.8-.8-2.9-.8-1.5 0-2.9.9-3.7 2.2-1.6 2.7-.4 6.7 1.1 8.9.7 1.1 1.5 2.2 2.6 2.2 1 0 1.4-.7 2.8-.7 1.3 0 1.7.7 2.8.7 1.1 0 1.8-1 2.5-2.1.8-1.2 1.1-2.4 1.1-2.5-.1 0-2.6-1-2.6-3.6zM14.5 6.2c.6-.8 1-1.9.9-2.9-1 .1-2.2.7-2.9 1.5-.6.7-1.1 1.8-1 2.8 1.1.1 2.3-.6 3-1.4z"/>

                    </svg>

                    <span>Apple</span>

                </button>

            </div>


            
<!-- =================================
     LOGIN FOOTER
================================== -->

<div class="vapor-login-divider vapor-login-footer-divider">
    <span></span>
</div>

<div class="vapor-login-footer">

    <p>
        Don't have an administrator account?
    </p>

    <a href="register.html" class="vapor-login-register-link">
        Register Now
        <i class="fa-solid fa-arrow-right"></i>
    </a>

    

</div>


        </section>

    </main>


    <!-- LOGIN JAVASCRIPT -->
    <script src="js/script.js"></script>
    <!-- COMMON THEME SCRIPT -->

    <script src="js/theme.js"></script>

</body>

</html>
